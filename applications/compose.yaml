services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  node-red:
    image: nodered/node-red:4.1
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - node_red_data:/data
    depends_on:
      - mqtt
volumes:
  node_red_data:
